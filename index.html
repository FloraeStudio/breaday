<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width， initial-scale=1.0">
  <title>BREADAY TAIPEI | 每天，從一份好麵包開始</title>
  <link rel="icon" href="assets/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz，wght@9..144，300;9..144，400;9..144，500&family=Noto+Serif+TC:wght@400;500;600&family=Noto+Sans+TC:wght@300;400;500&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/contact.css">
</head>

<body data-page="home">

  <header id="site-header"></header>

  <main id="home">
    <!-- Hero -->
    <section class="hero">
      <div class="hero-media" id="hero-media" role="img" aria-label="剛出爐的麵包特寫照片">
        <img class="hero-slide is-active" src="assets/images/hero/hero-01.webp" alt="">
        <img class="hero-slide" src="assets/images/hero/hero-02.webp" alt="">
        <img class="hero-slide" src="assets/images/hero/hero-03.webp" alt="">
        <img class="hero-slide" src="assets/images/hero/hero-04.webp" alt="">
      </div>
      <div class="hero-copy">
        <div class="hero-eyebrow">TAIWAN — SINCE 2026</div>
        <h1 class="hero-title char-reveal">每一天，<br>從一份好麵包開始。</h1>
        <p class="hero-desc">我們「希望成為讓人每天都想吃」的麵包店。選用熊本縣產小麥與能安心食用的食材，細心做好每一份麵包。</p>
      </div>
      <div class="hero-media-mark" aria-hidden="true"><span class="hero-media-mark-in">BREADAY</span></div>
    </section>

    <div class="cut-divider line-draw" aria-hidden="true">
      <svg viewBox="0 0 120 14">
        <path d="M0 7 Q10 1 20 7 T40 7 T60 7 T80 7 T100 7 T120 7" fill="none" stroke="#AB8666" stroke-width="1.2"
          pathLength="1" />
      </svg>
    </div>

    <!-- About 摘要:完整故事(含熊本地震)在 about.html -->
    <section class="section about-section" id="about">
      <div class="about-text scroll-reveal">
        <div class="section-index" aria-hidden="true" data-parallax="0.06">
          <span>01</span>
          <span>ABOUT</span>
        </div>
        <div class="about-text-body">
          <h2 class="about-title">用日常的心意，<br>做值得每天期待的麵包。</h2>
          <div class="about-divider" aria-hidden="true"></div>
          <div class="about-body">
            <p>我們以「希望成為讓人每天都想吃的麵包店」為目標，選用熊本縣產小麥與看得安心的食材，<br>
              細膩地對待每一次發酵與烘焙。</p>
          </div>
          <a href="about.html" class="btn">閱讀我們的故事 →</a>
        </div>
        <div class="about-quote" aria-hidden="true">
          <span>一份日常，一份心意。</span>
        </div>
      </div>
    </section>

    <!-- Products 精選:完整商品在 products.html -->
    <section class="section section-alt" id="products">
      <div class="container">
        <div class="products-head scroll-reveal">
          <div class="section-index" aria-hidden="true">
            <span>02</span>
            <span>PRODUCT LIST</span>
          </div>
          <div class="products-head-text">
            <h2 class="products-title">本週精選</h2>
            <div class="products-divider" aria-hidden="true"></div>
          </div>
        </div>

        <div class="products-grid" id="featured-grid">
          <!-- 由 js/main.js 透過 data-service.js 動態產生(僅前 3 件精選) -->
        </div>

        <a href="products.html" class="btn products-more">查看所有商品 →</a>
      </div>
    </section>

    <!-- Contact 引導:完整聯絡頁在 contact.html -->
    <section class="contact-section" id="contact">
      <div class="container">
        <div class="contact-grid scroll-reveal">
          <div class="section-index" aria-hidden="true" data-parallax="0.06">
            <span>03</span>
            <span>CONTACT</span>
          </div>
          <div class="contact-body">
            <h2 class="about-title contact-title">聯絡我們</h2>
            <div class="contact-divider" aria-hidden="true"></div>
            <a href="contact.html" class="btn btn-accent contact-btn">BREADAY TAIPEI →</a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer id="site-footer"></footer>

  <script src="https://unpkg.com/lenis@latest/dist/lenis.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>

</html>
