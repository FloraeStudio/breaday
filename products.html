<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width， initial-scale=1.0">
    <title>所有商品 | BREADAY TAIPEI</title>
    <link rel="icon" href="assets/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz，wght@9..144，300;9..144，400;9..144，500&family=Noto+Serif+TC:wght@400;500;600&family=Noto+Sans+TC:wght@300;400;500&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/products-page.css">
</head>

<body data-page="products">

    <header id="site-header"></header>

    <main>
        <section class="section product-list-page" id="products">
            <div class="container">
                <nav class="breadcrumb" aria-label="breadcrumb">
                    <ol>
                        <li><a href="index.html">首頁</a></li>
                        <li>所有商品</li>
                    </ol>
                </nav>

                <div class="product-list-head scroll-reveal">
                    <div class="page-kicker">
                        <span>PRODUCT LIST</span>
                    </div>
                    <h1 class="product-list-title">所有商品</h1>
                    <p class="product-list-desc">當日現做，用心，讓吃也安心。</p>
                </div>

                <div class="menu-tabs scroll-reveal" role="tablist" aria-label="商品分類">
                    <button type="button" class="menu-tab is-active" data-filter="all" role="tab"
                        aria-selected="true">所有商品</button>
                    <button type="button" class="menu-tab" data-filter="bread" role="tab"
                        aria-selected="false">麵包</button>
                    <button type="button" class="menu-tab" data-filter="coffee" role="tab"
                        aria-selected="false">咖啡</button>
                </div>

                <ul class="product-list" id="product-list">
                    <!-- 由 js/main.js 透過 data-service.js 動態產生 -->
                </ul>
                <p class="product-list-empty" id="product-list-empty" hidden>這個分類目前還沒有商品，敬請期待。</p>

                <button type="button" class="load-more-btn" id="load-more" hidden>載入更多</button>
            </div>
        </section>
    </main>

    <footer id="site-footer"></footer>

    <script src="https://unpkg.com/lenis@latest/dist/lenis.min.js"></script>
    <script type="module" src="js/main.js"></script>
</body>

</html>
