<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width， initial-scale=1.0">
    <title>聯絡我們 | BREADAY 台灣</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz，wght@9..144，300;9..144，400;9..144，500&family=Noto+Serif+TC:wght@400;500;600&family=Noto+Sans+TC:wght@300;400;500&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/main.css">
</head>

<body data-page="contact">

    <header id="site-header"></header>

    <main>
        <section class="contact-section" id="contact">
            <div class="container">
                <nav class="breadcrumb" aria-label="breadcrumb">
                    <ol>
                        <li><a href="index.html">首頁</a></li>
                        <li>聯絡我們</li>
                    </ol>
                </nav>
                <div class="page-kicker"><span>CONTACT</span></div>
                <div class="contact-grid scroll-reveal">
                    <div class="contact-body">
                        <h1 class="about-title contact-title">每天的好麵包，從 BREADAY 開始</h1>
                        <div class="contact-divider" aria-hidden="true"></div>
                        <p class="contact-desc">歡迎與我們聯繫，<br>我們會盡快回覆你的訊息。</p>
                        <form class="contact-form" id="contact-form">
                            <div class="form-field">
                                <label for="cf-name">姓名</label>
                                <input type="text" id="cf-name" name="name" required>
                            </div>
                            <div class="form-field">
                                <label for="cf-email">Email</label>
                                <input type="email" id="cf-email" name="email" required>
                            </div>
                            <div class="form-field">
                                <label for="cf-message">想說的話</label>
                                <textarea id="cf-message" name="message" rows="4" required></textarea>
                            </div>
                            <button type="submit" class="btn btn-accent contact-btn">送出訊息</button>
                        </form>
                    </div>
                </div>
                <div class="contact-stores">
                    <div class="contact-store scroll-reveal">
                        <div class="section-index" aria-hidden="true">
                            <span>MAP</span>
                            <span>熊本本店</span>
                        </div>
                        <div class="contact-store-body">
                            <p class="contact-store-name">BREADAY 熊本</p>
                            <div class="contact-store-divider" aria-hidden="true"></div>
                            <p class="contact-store-address">〒860-0808 熊本県熊本市中央区手取本町5-1 HAB 2F</p>
                            <a class="contact-store-link"
                                href="https://www.google.com/maps/place/BREADAY(%E3%83%96%E3%83%AC%E3%83%83%E3%83%87%E3%82%A3)%E7%86%8A%E6%9C%AC/@32.8027974,130.7074923,17z/data=!3m1!4b1!4m6!3m5!1s0x3540f598ef2e5841:0x107ee49be5d57c45!8m2!3d32.8027929!4d130.7100672!16s%2Fg%2F11t_k7rh2h"
                                target="_blank" rel="noopener noreferrer">在 GOOGLE 地圖開啟 →</a>
                        </div>
                    </div>

                    <!-- TODO: 台灣門市地址尚未確定，這裡先用佔位假地址；客戶提供實際門市資訊後，
         把 name / address / 連結網址整段換掉即可 -->
                    <div class="contact-store scroll-reveal">
                        <div class="section-index" aria-hidden="true">
                            <span>MAP</span>
                            <span>台灣門市</span>
                        </div>
                        <div class="contact-store-body">
                            <p class="contact-store-name">BREADAY 台灣</p>
                            <div class="contact-store-divider" aria-hidden="true"></div>
                            <p class="contact-store-address">地址籌備中</p>
                            <a class="contact-store-link" href="#">在 GOOGLE 地圖開啟 →</a>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer id="site-footer"></footer>

    <script src="https://unpkg.com/lenis@latest/dist/lenis.min.js"></script>
    <script type="module" src="js/main.js"></script>
</body>

</html>
