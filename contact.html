<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width， initial-scale=1.0">
    <title>聯絡我們 | BREADAY 台灣</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz，wght@9..144，300;9..144，400;9..144，500&family=Noto+Serif+TC:wght@400;500;600&family=Noto+Sans+TC:wght@300;400;500&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/main.css">
</head>

<body data-page="contact">

    <header id="site-header"></header>

    <main>
        <section class="contact-section" id="contact">
            <div class="container">
                <nav class="breadcrumb" aria-label="breadcrumb">
                    <ol>
                        <li><a href="index.html">首頁</a></li>
                        <li>聯絡我們</li>
                    </ol>
                </nav>
                <div class="page-kicker"><span>CONTACT</span></div>
                <div class="contact-grid scroll-reveal">
                    <div class="contact-body">
                        <h1 class="about-title contact-title">想預訂，或想更了解 BREADAY?</h1>
                        <div class="contact-divider" aria-hidden="true"></div>
                        <p class="contact-desc">歡迎透過以下方式與我們聯繫，我們會盡快回覆你的訊息。</p>
                        <!-- TODO: 換成實際的表單 / mailto: / 社群連結，目前跟 footer 的聯絡方式一樣還是待補狀態 -->
                        <a href="#" class="btn btn-accent contact-btn">聯絡我們</a>
                    </div>
                    <!-- TODO: 台灣門市地址尚未確定，暫時嵌入熊本本店座標；待台灣地址確認後，
                         只需換 iframe src 裡的座標／關鍵字，以及下方 caption 與連結即可 -->
                    <div class="contact-map">
                        <div class="contact-map-frame">
                            <span class="contact-map-badge">熊本本店</span>
                            <iframe
                                src="https://maps.google.com/maps?q=32.8027929,130.7100672&hl=zh-TW&z=16&output=embed"
                                loading="lazy" referrerpolicy="no-referrer-when-downgrade"
                                title="BREADAY 熊本本店 Google 地圖位置"></iframe>
                        </div>
                        <p class="contact-map-caption">
                            <strong>台灣門市地址籌備中</strong><br>
                            目前顯示為日本熊本本店位置，實際門市資訊確定後將會更新。
                        </p>
                        <a class="contact-map-link"
                            href="https://www.google.com/maps/place/BREADAY(%E3%83%96%E3%83%AC%E3%83%83%E3%83%87%E3%82%A3)%E7%86%8A%E6%9C%AC/@32.8027974,130.7074923,17z/data=!3m1!4b1!4m6!3m5!1s0x3540f598ef2e5841:0x107ee49be5d57c45!8m2!3d32.8027929!4d130.7100672!16s%2Fg%2F11t_k7rh2h"
                            target="_blank" rel="noopener noreferrer">在 Google 地圖開啟 →</a>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer id="site-footer"></footer>
    
    <script src="https://unpkg.com/lenis@latest/dist/lenis.min.js"></script>
    <script type="module" src="js/main.js"></script>
</body>

</html>
