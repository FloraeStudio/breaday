<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width， initial-scale=1.0">
    <title>聯絡我們 | BREADAY TAIPEI</title>

    <link rel="icon" href="assets/favicon.ico" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
    <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz，wght@9..144，300;9..144，400;9..144，500&family=Noto+Serif+TC:wght@400;500;600&family=Noto+Sans+TC:wght@300;400;500&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/contact.css">
</head>

<body data-page="contact">

    <header id="site-header"></header>

    <main>
        <section class="contact-section" id="contact">
            <div class="container">
                <nav class="breadcrumb" aria-label="breadcrumb">
                    <ol>
                        <li><a href="index.html">首頁</a></li>
                        <li>聯絡我們</li>
                    </ol>
                </nav>
                <div class="page-kicker"><span>CONTACT</span></div>
                <div class="contact-grid scroll-reveal">
                    <div class="contact-body">
                        <h1 class="about-title contact-title">每天的好麵包，從 BREADAY 開始</h1>
                        <div class="contact-divider" aria-hidden="true"></div>
                        <p class="contact-desc">歡迎與我們聯繫，<br>我們會盡快回覆你的訊息。</p>
                        <form class="contact-form" id="contact-form">
                            <div class="form-field">
                                <label for="cf-name">姓名</label>
                                <input type="text" id="cf-name" name="name" required>
                            </div>
                            <div class="form-field">
                                <label for="cf-email">Email</label>
                                <input type="email" id="cf-email" name="email" required>
                            </div>
                            <div class="form-field">
                                <label for="cf-message">想說的話</label>
                                <textarea id="cf-message" name="message" rows="4" required></textarea>
                            </div>
                            <button type="submit" class="btn btn-accent contact-btn">送出訊息</button>
                        </form>
                    </div>
                    <div class="contact-media">
                        <img class="contact-media-img" data-parallax="0.15" src="assets/images/contact/breaday-3.webp"
                            alt="BREADAY 台灣店內一隅">
                    </div>
                </div>

                <div class="contact-stores">
                    <div class="contact-store scroll-reveal">
                        <div class="section-index" aria-hidden="true">
                            <span>TW</span>
                            <span>台北門市</span>
                        </div>
                        <div class="contact-store-body">
                            <p class="contact-store-name">BREADAY TAIPEI</p>
                            <div class="contact-store-divider" aria-hidden="true"></div>
                            <p class="contact-store-address">電話預留位置</p>
                            <p class="contact-store-address">台北市大安區和平東路二段18之9號1樓</p>
                        </div>
                    </div>

                    <div class="contact-origin scroll-reveal">
                        <div class="contact-origin-logos">
                            <img class="contact-origin-logo" src="assets/images/contact/breaday-1.webp"
                                alt="BREADAY TAIPEI">
                            <img class="contact-origin-logo" src="assets/images/contact/breaday-2.webp"
                                alt="COFFEE BEANS CAME FROM FUGLEN">
                        </div>
                        <p class="contact-note">
                            來自日本熊本的麵包店，<a class="contact-note-link"
                                href="https://maps.app.goo.gl/hJdR6WXangAjkH7z8">熊本本店地圖位置 →</a>
                        </p>
                        <p class="contact-note">
                            熊本市中央区手取本町5-1 HAB@熊本2F ブレッディ
                        </p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer id="site-footer"></footer>

    <script src="https://unpkg.com/lenis@latest/dist/lenis.min.js"></script>
    <script type="module" src="js/main.js"></script>
    <script>
        document.getElementById('contact-form')?.addEventListener('submit', function (e) {
            e.preventDefault();

            const CONTACT_EMAIL = 'breaday2025@gmail.com';

            const name = document.getElementById('cf-name').value;
            const email = document.getElementById('cf-email').value;
            const message = document.getElementById('cf-message').value;

            const subject = encodeURIComponent(`BREADAY 台灣官網 - ${name}`);
            const body = encodeURIComponent(`姓名：${name}\nEmail：${email}\n\n${message}`);

            window.location.href = `mailto:${CONTACT_EMAIL}?subject=${subject}&body=${body}`;
        });
    </script>
</body>

</html>
