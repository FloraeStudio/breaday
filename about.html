                    <h1 class="about-title">用日常的心意，<br>做值得每天期待的麵包。</h1>
                    <div class="about-divider" aria-hidden="true"></div>
                    <div class="about-body">
                        <p>我們以「希望成為讓人每天都想吃的麵包店」為目標，用心地進行每天的麵包製作。</p>
                        <p>
                            受到熊本地震的影響，BREADAY目前暫停了實體店面的營業。過去，每天在店裡迎接大家、為大家送上剛出爐的麵包，是我們的日常。然而現在，這樣的日常按下了暫停鍵。即便如此，我們並不想「停下」，而是想用不同的形式，把麵包送到大家手中。
                        </p>
                    </div>
                </div>
                <div class="about-quote" aria-hidden="true">
                    <span>一份日常，一份心意。</span>
                </div>
